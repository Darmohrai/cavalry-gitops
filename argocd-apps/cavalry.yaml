# Cavalry application: Helm chart from charts/cavalry rendered with values-minikube.yaml.
# The Application name becomes the Helm release name, so objects are called cavalry-*.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cavalry
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Darmohrai/cavalry-gitops.git
    targetRevision: main
    path: charts/cavalry
    helm:
      valueFiles:
        - values-minikube.yaml   # relative to the chart directory (path)
  destination:
    server: https://kubernetes.default.svc
    namespace: cavalry
  syncPolicy:
    automated:
      prune: true
      selfHeal: false            # switched to true in step 6a
    # Lab 6: if this app is synced before the Argo Rollouts CRDs exist ("no matches for kind Rollout"),
    # Argo CD retries instead of stopping at SyncFailed: 10s, 20s, 40s, 80s, 160s.
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      # Do not fail the dry run for kinds whose CRD is not installed yet (Rollout)
      - SkipDryRunOnMissingResource=true
  # Blue-green only: the Rollouts controller adds rollouts-pod-template-hash to the Service selector.
  # Ignored so that it never shows up as OutOfSync (harmless for canary).
  ignoreDifferences:
    - group: ""
      kind: Service
      jsonPointers:
        - /spec/selector/rollouts-pod-template-hash
