# Lab 7: Loki in single-process mode (SingleBinary) with filesystem storage: no object storage,
# caches or test components. Since March 2026 the chart is maintained by the community (grafana-community).
# Grafana reads it through http://loki-gateway.monitoring, Alloy pushes to the same gateway.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: loki
    targetRevision: 20.2.2                 # helm search repo grafana-community/loki
    helm:
      valuesObject:
        deploymentMode: SingleBinary
        loki:
          auth_enabled: false              # single tenant, no X-Scope-OrgID header needed
          commonConfig: {replication_factor: 1}
          storage: {type: filesystem}
          schemaConfig:
            configs:
              - from: "2024-01-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index: {prefix: index_, period: 24h}
        singleBinary: {replicas: 1}
        read: {replicas: 0}
        write: {replicas: 0}
        backend: {replicas: 0}
        chunksCache: {enabled: false}
        resultsCache: {enabled: false}
        lokiCanary: {enabled: false}
        test: {enabled: false}
        # "minio: {enabled: false}" from the lab guide is rejected by the schema of chart 20.x
        # (helm template: additional properties 'minio' not allowed); MinIO is not part of it anymore.
  destination: {server: https://kubernetes.default.svc, namespace: monitoring}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
