# Root Application (App of Apps). The ONLY object applied by hand, once:
#   kubectl apply -f bootstrap/root.yaml
# It watches argocd-apps/ and creates every Application found there.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Darmohrai/cavalry-gitops.git
    targetRevision: main
    path: argocd-apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
