{{- /* Plain Deployment. Replaced by the Rollout (backend-rollout.yaml) when backend.rollout.enabled is true:
       two controllers must never manage pods with the same selector. */ -}}
{{- if not .Values.backend.rollout.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cavalry.fullname" . }}-backend
  labels:
    {{- include "cavalry.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  progressDeadlineSeconds: {{ .Values.backend.progressDeadlineSeconds }}
  selector:
    matchLabels:
      {{- include "cavalry.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    {{- include "cavalry.backend.podTemplate" . | nindent 4 }}
{{- end }}
