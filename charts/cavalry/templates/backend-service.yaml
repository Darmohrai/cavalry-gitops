apiVersion: v1
kind: Service
metadata:
  name: {{ include "cavalry.fullname" . }}-backend
  labels:
    {{- include "cavalry.labels" . | nindent 4 }}
    # Lab 7: the ServiceMonitor selects the backend Service by this label (keycloak, postgres, ...
    # share the other labels)
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - name: http              # Lab 7: the ServiceMonitor refers to the port by name
      port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.containerPort }}
      {{- if and (eq .Values.backend.service.type "NodePort") .Values.backend.service.nodePort }}
      nodePort: {{ .Values.backend.service.nodePort }}
      {{- end }}
  selector:
    {{- include "cavalry.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
