apiVersion: v1
kind: Service
metadata:
  name: {{ include "cavalry.fullname" . }}-keycloak
  labels:
    {{- include "cavalry.labels" . | nindent 4 }}
spec:
  ports:
    - port: {{ .Values.keycloak.port }}
  selector:
    {{- include "cavalry.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
