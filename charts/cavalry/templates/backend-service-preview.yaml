{{- /* Second Service for the blue-green strategy only: it points to the new (preview) version
       before promote. Not rendered for canary. */ -}}
{{- if and .Values.backend.rollout.enabled .Values.backend.rollout.strategy.blueGreen }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cavalry.fullname" . }}-backend-preview
  labels:
    {{- include "cavalry.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.containerPort }}
  selector:
    {{- include "cavalry.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
{{- end }}
