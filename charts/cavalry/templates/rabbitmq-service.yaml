apiVersion: v1
kind: Service
metadata:
  name: {{ include "cavalry.fullname" . }}-rabbitmq
  labels:
    {{- include "cavalry.labels" . | nindent 4 }}
spec:
  ports:
    - port: {{ .Values.rabbitmq.amqpPort }}
      name: amqp
    - port: {{ .Values.rabbitmq.managementPort }}
      name: management
  selector:
    {{- include "cavalry.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: rabbitmq
