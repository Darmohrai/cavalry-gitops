{{- /* Not rendered when existingSecret is set: the Secret is created by hand and never stored in Git */}}
{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cavalry.secretName" . }}
  labels:
    {{- include "cavalry.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.secret.postgresDb | quote }}
  POSTGRES_USER: {{ .Values.secret.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ .Values.secret.postgresPassword | quote }}
  KEYCLOAK_ADMIN: {{ .Values.secret.keycloakAdmin | quote }}
  KEYCLOAK_ADMIN_PASSWORD: {{ .Values.secret.keycloakAdminPassword | quote }}
{{- end }}
